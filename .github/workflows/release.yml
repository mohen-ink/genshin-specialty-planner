name: Build Clients

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows and Android Release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: pwsh
        run: |
          1..100 | ForEach-Object { "y" } | & sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;27.3.13750724"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: false

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/keys | Out-Null
          [IO.File]::WriteAllBytes(
            "src-tauri/keys/android-release.keystore",
            [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          )
          @(
            "keystore=src-tauri/keys/android-release.keystore"
            "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          ) | Set-Content src-tauri/keys/android-release.properties -Encoding ascii

      - name: Build Windows NSIS installer
        run: npm run desktop:build

      - name: Collect Windows portable executable
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-tauri/windows | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/app.exe -Destination "dist-tauri/windows/genshin-specialties_${version}_x64.exe"

      - name: Build signed Android arm64 APK
        run: npm run android:build:release

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clients
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-tauri/windows/*.exe
            dist-tauri/android/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-tauri/windows/*.exe
            dist-tauri/android/*.apk
